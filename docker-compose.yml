version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:partysecret@db:5432/partyvote
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: partyvote_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: partysecret
      POSTGRES_DB: partyvote
    ports:
      - "5433:5432" # Changed host port to 5433 to avoid conflict with local postgres on server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
